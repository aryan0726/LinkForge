spring:
  application:
    name: linkforge-backend

  datasource:
    # All connection details come from the environment. The defaults in
    # parentheses keep a fresh clone runnable; they are NOT for production.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/linkforge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      pool-name: linkforge-pool

  jpa:
    # Schema is owned by Flyway. Hibernate only verifies that the entities match
    # what the migrations produced, so drift fails fast at startup instead of
    # being silently "fixed" in the database.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never leak stack traces or exception messages to clients; the global
    # exception handler decides what a caller is allowed to see.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  # Used to build the public short URL. Must be the externally reachable origin
  # in production, e.g. https://linkforge.example.com
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    # Comma-separated list of allowed browser origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  # No default: the application refuses to start without a real secret.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.linkforge: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    # SQL logging is noisy and can leak parameter values into log files, so it
    # is off unless a developer explicitly enables it.
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
