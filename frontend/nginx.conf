server {
    # Listen on both stacks. A bare `listen 80;` binds IPv4 only, which breaks
    # IPv6 clients and Docker healthchecks, because `localhost` resolves to ::1
    # first inside the container. ipv6only=on keeps the two sockets separate.
    listen 80;
    listen [::]:80 ipv6only=on;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Hashed assets: cache aggressively ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API reverse proxy to the Spring Boot service ----
    # Makes the SPA and the API same-origin, so no CORS configuration is needed
    # in production. `backend` is the Compose service name.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ---- SPA fallback: every unknown path is served by index.html ----
    # Required so client-side routes such as /dashboard and /links work on a
    # hard refresh instead of returning nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML entry point must never be cached, or clients keep an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
